<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/styles.css">
  <title>Personal Profile Card</title>
</head>
<body>
  <div class="user-profile">
    <div class="profile-header"></div>
    <img src="images/image-victor.jpg" alt="profile-picture">
    <h1><span class="profile-name">Victor Crest</span> <span class="age">26</span></h1>
    <h2 class="city">London</h2>
    <section>
      <div><span class="profile-stats">80K</span> <br><span profile-stats-label></span>Followers</div>
      <div><span class="profile-stats">300K</span> <br><span profile-stats-label></span>Likes</div>
      <div><span class="profile-stats">1.4K</span> <br><span profile-stats-label></span>Photos</div>
    </section>
  </div>
</body>
</html>
