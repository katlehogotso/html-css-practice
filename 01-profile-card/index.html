<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght,YOPQ@100..900,300&display=swap" rel="stylesheet">
  <title>Personal Profile Card</title>
</head>
<body>
  <div class="container">
    <div class="user-profile">
      <div>
        <img src="images/bg-pattern-card.svg" alt="header-card" class="profile-header">
      </div>
      <img src="images/image-victor.jpg" alt="profile-picture" class="profile-pic">
      <h1><span class="profile-name">Victor Crest</span> <span class="age">26</span></h1>
      <h2 class="city">London</h2>
      <section>
        <dl class="profile-stats-container">
          <div>
            <dd class="profile-stats">80K</dd>
            <dt class="profile-stats-label">Followers</dt>
          </div>
          <div>
            <dd class="profile-stats">300K</dd>
            <dt class="profile-stats-label">Likes</dt>
          </div>
          <div>
            <dd class="profile-stats">1.4K</dd>
            <dt class="profile-stats-label">Photos</dt>
          </div>
        </dl>
      </section>
    </div>
  </div>
</body>
</html>
