<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght,YOPQ@100..900,300&display=swap" rel="stylesheet">
  <title>Personal Profile Card</title>
</head>
<body>
  <div class="user-profile">
    <div class="profile-header"></div>
    <img src="images/image-victor.jpg" alt="profile-picture">
    <h1><span class="profile-name">Victor Crest</span> <span class="age">26</span></h1>
    <h2 class="city">London</h2>
    <section>
      <div><span class="profile-stats">80K</span> <br><span class="profile-stats-label">Followers</span></div>
      <div><span class="profile-stats">300K</span> <br><span class="profile-stats-label">Likes</span></div>
      <div><span class="profile-stats">1.4K</span> <br><span class="profile-stats-label">Photos</span></div>
    </section>
  </div>
</body>
</html>
